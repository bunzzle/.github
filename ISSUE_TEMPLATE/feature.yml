name: Feature request
description: Suggest something Bunzzle should do.
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Other ways you considered
